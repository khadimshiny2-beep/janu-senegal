<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="look-bg" x1="0" y1="0" x2="85%" y2="100%">
      <stop offset="0" stop-color="#241a0c"/>
      <stop offset=".5" stop-color="#14100a"/>
      <stop offset="1" stop-color="#080705"/>
    </linearGradient>
    <pattern id="look-wax" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <path d="M60 8L112 60L60 112L8 60Z" fill="none" stroke="#d5b062" stroke-width="1"/>
      <circle cx="60" cy="60" r="10" fill="none" stroke="#d5b062" stroke-width=".9"/>

  <g fill="none" stroke="#d5b062" stroke-width="1.2" opacity=".9">
    <path d="M362 194C378 222 422 222 438 194"/>
    <path d="M322 470L478 470"/>
    <path d="M370 470C356 620 340 780 330 900"/>

      <circle cx="0" cy="0" r="3" fill="#d5b062" opacity=".8"/>
      <circle cx="110" cy="110" r="3" fill="#d5b062" opacity=".8"/>
    </pattern>
    <filter id="ter-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="ter-grain">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#ter-bg)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="ter-bg" x1="0" y1="0" x2="75%" y2="100%">
      <stop offset="0" stop-color="#241a0c"/>
      <stop offset=".55" stop-color="#171208"/>
      <stop offset="1" stop-color="#0c0a06"/>
    </linearGradient>
    <pattern id="ter-wax" width="110" height="110" patternUnits="userSpaceOnUse" patternTransform="rotate(10)">
      <path d="M55 8 L102 55 L55 102 L8 55 Z" fill="none" stroke="#d5b062" stroke-width="1"/>
      <circle cx="55" cy="55" r="10" fill="none" stroke="#d5b062" stroke-width=".9"/>

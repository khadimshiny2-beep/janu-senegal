  <path d="M400 168C352 168 322 196 306 234C274 250 256 292 248 338C244 356 256 366 272 360L314 344L330 430L322 470L238 902L562 902L478 470L470 430L486 344L528 360C544 366 556 356 552 338C544 292 526 250 494 234C478 196 448 168 400 168Z"

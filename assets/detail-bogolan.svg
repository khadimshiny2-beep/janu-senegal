<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bog-bg" x1="0" y1="0" x2="70%" y2="100%">
      <stop offset="0" stop-color="#e6d7b8"/>
      <stop offset=".55" stop-color="#cdb98f"/>
      <stop offset="1" stop-color="#a8916a"/>
    </linearGradient>
    <pattern id="bog-motif" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M0 24L24 6L48 24L72 6L96 24" fill="none" stroke="#2a2117" stroke-width="2.4"/>
      <path d="M0 72L24 54L48 72L72 54L96 72" fill="none" stroke="#2a2117" stroke-width="2.4"/>
      <path d="M24 24L24 54M72 24L72 54" stroke="#2a2117" stroke-width="1.2"/>
      <circle cx="48" cy="39" r="3.5" fill="#2a2117"/>
    </pattern>
    <filter id="bog-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="bog-grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bog-bg)"/>
  <rect width="800" height="1000" fill="url(#bog-motif)" opacity=".55"/>
  <ellipse cx="160" cy="200" rx="280" ry="260" fill="#f7ecd5" opacity=".45" filter="url(#bog-soft)"/>
  <ellipse cx="660" cy="860" rx="300" ry="320" fill="#6b5433" opacity=".4" filter="url(#bog-soft)"/>

  <g fill="none" stroke="#2a2117" stroke-linecap="round">
    <path d="M-40 700C180 620 340 500 540 400 680 330 780 290 860 260" stroke-width="2" opacity=".28"/>
    <path d="M-40 800C200 710 380 590 580 490 710 420 800 380 860 350" stroke-width="1.4" opacity=".2"/>
    <path d="M-40 900C220 800 410 680 610 570 730 500 810 460 860 430" stroke-width="1" opacity=".14"/>
  </g>

  <rect width="800" height="1000" filter="url(#bog-grain)" opacity=".9"/>
</svg>

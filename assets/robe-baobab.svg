<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bao-bg" x1="0" y1="0" x2="75%" y2="100%">
      <stop offset="0" stop-color="#260f0f"/>
      <stop offset=".55" stop-color="#180a0a"/>
      <stop offset="1" stop-color="#0b0505"/>
